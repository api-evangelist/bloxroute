aid: bloxroute
name: bloXroute
description: >-
  bloXroute operates the Blockchain Distribution Network (BDN), a high-capacity,
  low-latency global relay network that speeds up transaction and block
  propagation for blockchain traders, builders, and validators. Its developer
  surface spans the BDN Gateway and Cloud API, the Solana Trader API
  (gRPC/HTTP/WebSocket/QUIC) for low-latency transaction submission, bundles,
  sniping, and DEX routing across Pump.fun, Jupiter, and Raydium, real-time
  mempool/block/event streams (newTxs, pendingTxs, txReceipts, newBlocks), the
  Optimized Feed Relay (OFR) shred stream, MEV relay and BackRunMe programs, and
  Protect/Fast RPC services. Supported chains include Solana, BNB Chain, Base,
  Ethereum, Polygon, Hyperliquid, Robinhood, Monad, and X Layer. Added to the
  API Evangelist network as a crypto-infrastructure provider.
